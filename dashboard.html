<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathsBuddy - Home</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
 <div class="topbar-inner">
    <div class="topbar-brand"><span class="brand-logo small">🧮</span> MathsBuddy</div>
    <div class="topbar-right">
      <span id="student-badge" class="student-badge"></span>
      <button id="logout-button" class="btn btn-ghost btn-sm">Log out</button>
    </div>
 </div>
</header>

<main class="page">

 <section class="hero-row">
    <div class="hero-card">
      <h1 id="greeting">Hi!</h1>
      <p id="hero-sub">Pick a topic to learn, or ask the AI buddy anything about maths.</p>
      <div class="stat-row" id="stat-row"></div>
    </div>
    <div class="mascot-card">
      <div class="mascot">🦉</div>
      <p id="mascot-tip" class="mascot-tip"></p>
    </div>
 </section>

 <section class="panel" id="ai-panel">
    <div class="panel-head">
      <h2>🤖 AI Maths Buddy</h2>
      <button id="clear-chat" class="btn btn-ghost btn-sm">Clear chat</button>
    </div>
    <div id="chat-window" class="chat-window"></div>
    <div class="chat-suggestions" id="chat-suggestions"></div>
    <form id="chat-form" class="chat-form" autocomplete="off">
      <input id="chat-input" type="text" placeholder="Ask me any maths question..." maxlength="200">
      <button type="submit" class="btn btn-primary">Send</button>
    </form>
 </section>

 <section class="panel">
    <div class="panel-head">
      <h2>📚 Topics for <span id="topics-class-label"></span></h2>
      <p class="panel-hint">Each topic has a lesson and a quiz.</p>
    </div>
    <div id="topic-grid" class="topic-grid"></div>
 </section>

</main>

<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/ai.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
